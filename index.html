
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Randomizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 18px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 0 0 18px;
    }

    h2 {
      font-size: 15px;
      margin: 0 0 8px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 0.85fr;
      gap: 14px;
      align-items: stretch;
    }

    .text-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-section {
      padding: 13px;
      background: #f7f7f7;
      border-radius: 9px;
      min-width: 0;
    }

    .result-text {
      font-size: 19px;
      font-weight: bold;
      overflow-wrap: anywhere;
      min-height: 25px;
      margin: 5px 0 10px;
    }

    .image-section {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .image-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #eee;
      border-radius: 9px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 8px 11px;
      font-size: 12px;
      cursor: pointer;
      background: #222;
      color: white;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.8;
    }

    .button-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .gallery-section {
      margin-top: 18px;
    }

    .gallery-section h2 {
      margin-bottom: 10px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 7px;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      background: #eee;
      transition: border-color 0.2s;
    }

    .gallery img:hover {
      border-color: #999;
    }

    .gallery img.selected {
      border-color: #222;
    }

    .main-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 17px;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #888;
      margin-top: 18px;
    }

    @media (max-width: 600px) {
      body {
        padding: 9px;
      }

      .container {
        padding: 12px;
      }

      h1 {
        font-size: 21px;
      }

      .results-grid {
        grid-template-columns: 1fr 0.85fr;
        gap: 9px;
      }

      .result-section {
        padding: 9px;
      }

      .result-text {
        font-size: 15px;
      }

      button {
        padding: 7px 8px;
        font-size: 11px;
      }

      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
        gap: 5px;
      }
    }

    @media (max-width: 380px) {
      .results-grid {
        grid-template-columns: 1fr;
      }

      .image-section {
        max-width: 280px;
        width: 100%;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Brand Randomizer</h1>

    <div class="results-grid">
      <div class="text-column">

        <section class="result-section">
          <h2>Business Type</h2>
          <div class="result-text" id="businessType">Click randomize to start</div>
          <div class="button-row">
            <button onclick="randomizeBusiness()">Randomize</button>
          </div>
        </section>

        <section class="result-section">
          <h2>Brand Name</h2>
          <div class="result-text" id="brandName">Your brand name</div>
          <div class="button-row">
            <button onclick="randomizeName()">Randomize</button>
            <button onclick="copyBrandName()">Copy</button>
          </div>
        </section>

      </div>

      <section class="image-section">
        <h2>Color Inspiration</h2>
        <div class="image-frame">
          <img id="mainImage" alt="Color inspiration">
        </div>
        <div class="button-row" style="margin-top: 8px;">
          <button onclick="randomizeImage()">Randomize Image</button>
        </div>
      </section>
    </div>

    <div class="main-actions">
      <button onclick="generateAll()">Generate All</button>
    </div>

    <section class="gallery-section">
      <h2>Image Gallery</h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <div class="footer">
      Brand Randomizer
    </div>
  </main>

  <script>
    const businessTypes = [
      "Fashion Brand",
      "Skincare Brand",
      "Coffee Shop",
      "Restaurant",
      "Jewelry Brand",
      "Interior Design Studio",
      "Creative Agency",
      "Bakery",
      "Perfume Brand",
      "Wellness Brand",
      "Candle Brand",
      "Furniture Brand",
      "Beauty Salon",
      "Clothing Store",
      "Flower Shop",
      "Bookstore",
      "Art Studio",
      "Photography Studio",
      "Travel Agency",
      "Pet Brand",
      "Technology Brand",
      "Sportswear Brand",
      "Home Decor Brand",
      "Tea Brand",
      "Chocolate Brand",
      "Hotel",
      "Luxury Accessories Brand",
      "Ceramics Studio",
      "Food Brand",
      "Lifestyle Brand"
    ];

    const singleWords = [
      "Aurelia", "Solace", "Velora", "Lunelle",
      "Novara", "Elowen", "Sorelle", "Avora",
      "Calista", "Ovelle", "Lumora", "Zarela",
      "Orlena", "Virelle", "Amoura", "Nuvia",
      "Elaris", "Avenor", "Marvelle", "Isola",
      "Aloura", "Seren", "Oriana", "Vellum",
      "Ciela", "Arden", "Mirelle", "Solis",
      "Evora", "Liora", "Nolia", "Aster",
      "Vesper", "Elara", "Sienna", "Aureve"
    ];

    const firstWords = [
      "Golden", "Soft", "Velvet", "Sunday",
      "Silver", "Little", "Wild", "Modern",
      "Pure", "Hidden", "Slow", "Amber",
      "Quiet", "Blue", "Maison", "Olive",
      "Cloud", "Honey", "Rare", "Blush",
      "Dream", "Urban", "Satin", "Mellow",
      "Golden", "Studio", "Bloom", "Ivory"
    ];

    const secondWords = [
      "Theory", "Muse", "Studio", "House",
      "Garden", "Atelier", "Society", "Collective",
      "Moment", "Ritual", "Form", "Archive",
      "Edit", "Concept", "Bloom", "Essence",
      "Label", "Market", "Living", "Stories",
      "Objects", "Aura", "Room", "Project",
      "Days", "World", "Coast", "Lane"
    ];

    const imageNumbers = Array.from(
      { length: 50 },
      (_, index) => index + 1
    );

    const extensions = [
      "png",
      "jpg",
      "jpeg",
      "webp",
      "PNG",
      "JPG",
      "JPEG",
      "WEBP"
    ];

    const imageCache = new Map();

    let selectedImageNumber = null;

    function randomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function randomizeBusiness() {
      document.getElementById("businessType").textContent =
        randomItem(businessTypes);
    }

    function randomizeName() {
      let name;

      if (Math.random() < 0.45) {
        name = randomItem(singleWords);
      } else {
        name = randomItem(firstWords) + " " + randomItem(secondWords);
      }

      document.getElementById("brandName").textContent = name;
    }

    function loadImage(img, number, onSuccess, onFailure) {
      if (imageCache.has(number)) {
        img.src = imageCache.get(number);
        if (onSuccess) onSuccess();
        return;
      }

      let extensionIndex = 0;

      function tryNextExtension() {
        if (extensionIndex >= extensions.length) {
          if (onFailure) onFailure();
          return;
        }

        const extension = extensions[extensionIndex++];
        const path = `images/${number}.${extension}`;

        const testImage = new Image();

        testImage.onload = function() {
          imageCache.set(number, path);
          img.src = path;
          if (onSuccess) onSuccess();
        };

        testImage.onerror = tryNextExtension;
        testImage.src = path;
      }

      tryNextExtension();
    }

    function updateSelectedImage() {
      document.querySelectorAll(".gallery img").forEach(img => {
        img.classList.toggle(
          "selected",
          Number(img.dataset.number) === selectedImageNumber
        );
      });
    }

    function showImage(number) {
      const mainImage = document.getElementById("mainImage");

      selectedImageNumber = number;
      updateSelectedImage();

      mainImage.alt = `Color inspiration ${number}`;

      loadImage(
        mainImage,
        number,
        null,
        function() {
          mainImage.removeAttribute("src");
          mainImage.alt = `Image ${number} could not be loaded`;
          console.warn(`Could not load image ${number}. Check its filename and extension.`);
        }
      );
    }

    function randomizeImage() {
      const number = randomItem(imageNumbers);
      showImage(number);
    }

    function copyBrandName() {
      const name = document.getElementById("brandName").textContent;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(name);
      } else {
        const temporary = document.createElement("textarea");
        temporary.value = name;
        document.body.appendChild(temporary);
        temporary.select();
        document.execCommand("copy");
        temporary.remove();
      }
    }

    function generateAll() {
      randomizeBusiness();
      randomizeName();
      randomizeImage();
    }

    function createGallery() {
      const gallery = document.getElementById("gallery");
      const fragment = document.createDocumentFragment();

      imageNumbers.forEach(number => {
        const img = document.createElement("img");

        img.alt = `Color inspiration ${number}`;
        img.dataset.number = number;
        img.loading = "lazy";
        img.decoding = "async";

        img.addEventListener("click", function() {
          showImage(number);
        });

        loadImage(
          img,
          number,
          null,
          function() {
            img.style.display = "none";
          }
        );

        fragment.appendChild(img);
      });

      gallery.appendChild(fragment);
    }

    createGallery();
    generateAll();
  </script>
</body>
</html>
